# SwiftDrop security crate — see crates/security/src/lib.rs for docs.
[package]
name = "swiftdrop-security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
swiftdrop-protocol = { workspace = true }
# TLS 1.3 (spec NFR-SEC-001). `default-features = false` + `ring` keeps us
# TLS-1.3-only with the well-audited `ring` crypto backend.
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# Self-signed certificates — used ONLY to enable TLS. Identity and
# authentication are handled by our own protocol layer (ADR-0002).
rcgen = { workspace = true }
# P-256 keys/signatures for device identity + auth signatures.
p256 = { workspace = true }
signature = { workspace = true }
# SHA-256 for identity hashing + integrity (spec §7.2).
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Platform config directory (`~/.config`, `%APPDATA%`).
dirs = { workspace = true }

[dev-dependencies]
tempfile = "3"
